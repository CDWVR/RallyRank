name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Remediation invariants
        run: npm run check:remediation

  server-integration:
    runs-on: ubuntu-latest
    # Same stack as docker-compose.yml: migrations, auth API, PostgREST and RLS checked against real Postgres.
    # PostgREST is started after migrating, not as a service: it exits on its first failed login, and
    # service containers are never restarted, so it would die before migrate creates the authenticator role.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rallyrank
      AUTHENTICATOR_PASSWORD: authenticator-ci-password
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      POSTGREST_URL: http://localhost:3001
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rallyrank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rallyrank"
          --health-interval 2s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrate (twice, to prove it is idempotent)
        run: npm run migrate && npm run migrate

      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:${AUTHENTICATOR_PASSWORD}@localhost:5432/rallyrank" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="${JWT_SECRET}" \
            -e PGRST_JWT_AUD=authenticated \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.12

      - name: Wait for PostgREST
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3001/ > /dev/null && exit 0; sleep 1; done
          echo "::error::PostgREST did not become ready"; docker logs postgrest; exit 1

      - name: Server integration tests
        run: npx vitest run server
